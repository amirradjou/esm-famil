name: Deploy web client
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'netlify.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: build and publish to Netlify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @esm-famil/shared build
      - name: Build the client against the public game server
        run: pnpm --filter @esm-famil/web build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@latest deploy --no-build --filter @esm-famil/web --prod --dir apps/web/dist --message "GitHub Actions ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
