# Static deployment of the web client only. The game server (WebSockets, in-memory rooms)
# runs elsewhere and the client reaches it through VITE_SERVER_URL — see docs/self-hosting.md.
[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @esm-famil/shared build && pnpm --filter @esm-famil/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify serves .webmanifest as octet-stream by default; browsers want the manifest type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
